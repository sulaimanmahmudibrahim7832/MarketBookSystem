

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>PITMS - Import Products</title>

<link rel="stylesheet" href="../css/import.css">
<link rel="stylesheet" href="../../components/shared/shared.css">
<link rel="stylesheet" href="../../components/menu-drawer/menu.css">

</head>
<body>
    <header class="header">
        </header>    
          <aside
          class="menu-drawer"
          id="menuDrawer">
 
  </aside>
    <main class="page-container">
        <!-- PAGE HEADER -->

<section class="page-header">

    <div>

        <p class="page-label">
            PITMS
        </p>

        <h1>
            Import Products
        </h1>

        <p class="page-description">
            Record products entering your business inventory.
        </p>

    </div>


    <div class="header-info">

        <span>
            Import Records
        </span>

        <strong id="importRecordCount">
            0
        </strong>

    </div>

</section>



<!-- IMPORT FORM -->

<section class="import-section">


    <div class="section-heading">

        <h2>
            New Import
        </h2>

        <p>
            Select an active product and record the quantity received.
        </p>

    </div>



    <form id="importForm">


        <div class="form-grid">


            <!-- PRODUCT -->

            <div class="form-group">

                <label for="productId">
                    Product
                </label>

                <select
                    id="productId"
                    name="productId"
                    required>

                    <option value="">
                        Select active product
                    </option>

                </select>

            </div>



            <!-- QUANTITY -->

            <div class="form-group">

                <label for="quantity">
                    Quantity
                </label>

                <input
                    id="quantity"
                    name="quantity"
                    type="number"
                    min="1"
                    placeholder="Enter quantity"
                    required>

            </div>



            <!-- SUPPLIER -->

            <div class="form-group">

                <label for="supplier">
                    Supplier
                </label>

                <input
                    id="supplier"
                    name="supplier"
                    type="text"
                    placeholder="Enter supplier name"
                    required>

            </div>



            <!-- REFERENCE -->

            <div class="form-group">

                <label for="reference">
                    Reference
                </label>

                <input
                    id="reference"
                    name="reference"
                    type="text"
                    placeholder="Invoice / receipt reference">

            </div>



            <!-- DATE -->

            <div class="form-group">

                <label for="importDate">
                    Import Date
                </label>

                <input
                    id="importDate"
                    name="importDate"
                    type="date"
                    required>

            </div>



            <!-- NOTE -->

            <div class="form-group full-width">

                <label for="note">
                    Note
                </label>

                <textarea
                    id="note"
                    name="note"
                    rows="4"
                    placeholder="Additional information about this import">
                </textarea>

            </div>


        </div>



        <!-- FORM ACTIONS -->

        <div class="form-actions">

            <button
                type="reset"
                class="secondary-button">

                Clear

            </button>


            <button
                type="submit"
                class="primary-button">

                Record Import

            </button>

        </div>


    </form>

</section>



<!-- RECENT IMPORTS -->

<section class="records-section">


    <div class="section-heading">

        <div>

            <h2>
                Recent Imports
            </h2>

            <p id="recentImportCount">
                0 records
            </p>

        </div>

    </div>



    <!-- DESKTOP TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Import ID
                    </th>

                    <th>
                        Product
                    </th>

                    <th>
                        Quantity
                    </th>

                    <th>
                        Supplier
                    </th>

                    <th>
                        Reference
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="importTableBody">

                <!-- JavaScript inserts records -->

            </tbody>

        </table>

    </div>



    <!-- MOBILE RECORDS -->

    <div
        class="mobile-record-list"
        id="mobileImportList">

        <!-- JavaScript inserts records -->

    </div>


</section>

</main>
<script type="module" src="../js/import.js">

</script>
<script src="../../components/menu-drawer/drawer.js">

</script>
<script src="../../components/menu-drawer/menu.js">

</script>

</body>
</html>
